# note: the hosted judge page holds only the leash key and a model key, never the owner's key
services:
  - type: web
    name: countersign
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@12.18.0 install --frozen-lockfile --prod
    startCommand: node src/web/server.ts
    healthCheckPath: /api/board
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: AGENT_LEASH_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://cloud-api.near.ai/v1
      - key: LLM_API_KEY
        sync: false
      # note: a model that still follows injected bills, so a visitor sees the guard decide; deepseek refuses on its own
      - key: LLM_MODEL
        value: Qwen/Qwen3.6-35B-A3B-FP8
      - key: DAILY_ATTEMPTS
        value: "300"
